<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Học trực tuyến CNTT</title>

<style>
body{
    font-family: Arial, sans-serif;
}

.container{
    width: 850px;
    height: 450px;
    margin: 20px auto;
    border: 1px solid black;
    display: flex;
}

.menu{
    width: 250px;
    background-color: #f0f0f0;
}

.menu ul{
    list-style: none;
    padding: 0;
    margin: 0;
}

.menu li{
    padding: 15px;
}

.content{
    flex: 1;
    padding: 20px;
}
</style>

</head>
<body>

<div class="container">

    <div class="menu">
        <ul>
            <li>Trang chủ</li>
            <li>Khóa học</li>
            <li>Diễn đàn</li>
            <li>Liên hệ</li>
        </ul>
    </div>

    <div class="content">
        <h1>Học trực tuyến Công nghệ thông tin</h1>

        <h2>Các khóa học:</h2>

        <ol>
            <li>Lập trình cơ bản</li>
            <li>Cấu trúc dữ liệu</li>
            <li>Thiết kế web</li>
        </ol>
    </div>

</div>

</body>
</html>
